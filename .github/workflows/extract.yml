name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip to repo root
        run: |
          unzip -o makefun-office-joke.zip
          rm -f makefun-office-joke.zip
          git checkout HEAD -- .github || true
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet || git commit -m "Extract makefun-office-joke.zip to repo root"
          git push
