name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move extracted files to repo root
        run: |
          ls -la
          ls -la makefun-office-joke || true
          shopt -s dotglob
          mv makefun-office-joke/* .
          rmdir makefun-office-joke
          git checkout HEAD -- .github || true
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet || git commit -m "Move extracted files to repo root"
          git push
